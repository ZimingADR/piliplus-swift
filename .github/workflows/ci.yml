name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.1 (iOS 27.1 SDK)
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos27|iphonesimulator27' || true
          xcodebuild -showsdks | grep -q 'iphoneos27\.1' || {
            echo "::error::iOS 27.1 SDK was not found on this runner"
            xcodebuild -showsdks
            exit 1
          }
          xcrun simctl list runtimes | grep -E 'iOS 27' || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Validate SideStore source
        run: |
          python3 -m py_compile scripts/update_altstore_source.py
          python3 - <<'PY'
          import json
          with open("altstore.json", encoding="utf-8") as fp:
              manifest = json.load(fp)
          app = manifest["apps"][0]
          version = app["versions"][0]
          assert app["bundleIdentifier"] == "com.zimingadr.piliplus"
          for key in ("version", "downloadURL", "size", "minOSVersion"):
              assert key in version, key
          assert version["size"] > 0
          print("altstore.json OK:", version["version"], version["size"])
          PY

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm/security
            build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -project PiliPlus.xcodeproj -scheme PiliPlus \
            -resolvePackageDependencies -derivedDataPath build/DerivedData | tail -n 80

      - name: Build app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PiliPlus.xcodeproj \
            -scheme PiliPlus \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Run unit tests
        run: |
          set -o pipefail
          UDID=$(python3 - <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in data["devices"].items():
              if "iOS-27-1" not in runtime:
                  continue
              for device in devices:
                  if "iPhone" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no iOS 27.1 iPhone simulator available")
          PY
          )
          echo "Using simulator $UDID"
          test -n "$UDID"
          xcodebuild test \
            -project PiliPlus.xcodeproj \
            -scheme PiliPlus \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 300
