name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.0）"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build unsigned IPA & SideStore source
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 发布后需要把 altstore.json 提交回 main，必须拿到完整历史才能 rebase。
          fetch-depth: 0

      - name: Select Xcode 27.1 (iOS 27.1 SDK)
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -q 'iphoneos27\.1' || {
            echo "::error::iOS 27.1 SDK was not found on this runner"
            xcodebuild -showsdks
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Resolve packages
        run: |
          set -o pipefail
          xcodebuild -project PiliPlus.xcodeproj -scheme PiliPlus \
            -resolvePackageDependencies -derivedDataPath build/DerivedData | tail -n 80

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PiliPlus.xcodeproj \
            -scheme PiliPlus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PiliPlus.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 300

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.tag || '0.1.0' }}"
            VERSION="${VERSION#v}"
            TAG_NAME="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "Release version: ${VERSION} (tag ${TAG_NAME})"

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/PiliPlus.xcarchive/Products/Applications/PiliPlus.app build/Payload/
          cd build
          zip -qry "PiliPlus-${VERSION}-unsigned.ipa" Payload
          shasum -a 256 "PiliPlus-${VERSION}-unsigned.ipa" \
            | tee "PiliPlus-${VERSION}-unsigned.ipa.sha256"

      - name: Update SideStore source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          python3 scripts/update_altstore_source.py \
            --source-json altstore.json \
            --app-bundle build/PiliPlus.xcarchive/Products/Applications/PiliPlus.app \
            --ipa "build/PiliPlus-${VERSION}-unsigned.ipa" \
            --download-url "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/PiliPlus-${VERSION}-unsigned.ipa" \
            --repo "${{ github.repository }}" \
            --version "${VERSION}"
          python3 -m json.tool altstore.json > /dev/null
          echo "SideStore source updated:"
          python3 -c "import json;d=json.load(open('altstore.json'));v=d['apps'][0]['versions'][0];print(v['version'], v['size'], v['downloadURL'])"

      - name: Commit SideStore source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- altstore.json; then
            echo "altstore.json 未变化，跳过提交"
            exit 0
          fi
          git add altstore.json
          git commit -m "chore(altstore): 更新 SideStore 订阅源到 ${TAG_NAME}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-unsigned-ipa
          path: |
            build/*.ipa
            build/*.sha256
            altstore.json
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.ipa
            build/*.sha256
            altstore.json
          generate_release_notes: true
          body: |
            > ⚠️ 本产物为**未签名** IPA，需要 SideStore / AltStore / TrollStore
            > 或自己的开发者证书重签后安装。

            ### SideStore / AltStore 订阅源

            `https://raw.githubusercontent.com/ZimingADR/piliplus-swift/main/altstore.json`

            在设备上直接打开即可添加源：

            ```
            sidestore://source?url=https://raw.githubusercontent.com/ZimingADR/piliplus-swift/main/altstore.json
            ```
