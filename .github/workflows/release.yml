name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.0）"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Resolve packages
        run: |
          set -o pipefail
          xcodebuild -project PiliPlus.xcodeproj -scheme PiliPlus \
            -resolvePackageDependencies -derivedDataPath build/DerivedData | tail -n 80

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PiliPlus.xcodeproj \
            -scheme PiliPlus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PiliPlus.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 300

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/PiliPlus.xcarchive/Products/Applications/PiliPlus.app build/Payload/
          VERSION="${{ github.event.inputs.tag || '0.1.0' }}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "Packaging PiliPlus ${VERSION}"
          cd build
          zip -qry "PiliPlus-${VERSION}-unsigned.ipa" Payload
          shasum -a 256 "PiliPlus-${VERSION}-unsigned.ipa" | tee "PiliPlus-${VERSION}-unsigned.ipa.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-unsigned-ipa
          path: |
            build/*.ipa
            build/*.sha256
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.ipa
            build/*.sha256
          generate_release_notes: true
          body: |
            > ⚠️ 本产物为**未签名** IPA，需要自行使用 AltStore / SideStore / TrollStore
            > 或自己的开发者证书重签后安装。详见 README。
