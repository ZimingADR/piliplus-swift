name: PiliPlus

options:
  minimumXcodeGenVersion: "2.42.0"
  bundleIdPrefix: com.zimingadr
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true

fileGroups:
  - project.yml
  - README.md

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # 显式固定隔离语义，避免不同 Xcode 版本的默认值差异影响编译结果。
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "27.1"
    ENABLE_MODULE_VERIFIER: NO

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: "1.1.0-n9.0.2"

targets:
  PiliPlus:
    type: application
    platform: iOS
    deploymentTarget: "27.1"
    sources:
      - path: PiliPlus
        excludes:
          - "Supporting/Info.plist"
          - "Supporting/PiliPlus.entitlements"
      - path: Shared
    dependencies:
      - package: MPVKit
        product: MPVKit
      - target: PiliPlusWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: PiliPlus
        PRODUCT_BUNDLE_IDENTIFIER: com.zimingadr.piliplus
        INFOPLIST_FILE: PiliPlus/Supporting/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PiliPlus/Supporting/PiliPlus.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"

  PiliPlusTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.1"
    sources:
      - path: Tests/PiliPlusTests
    dependencies:
      - target: PiliPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zimingadr.piliplus.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PiliPlus.app/PiliPlus"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PiliPlusWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.1"
    sources:
      - path: PiliPlusWidgets
        excludes:
          - "Info.plist"
          - "PiliPlusWidgets.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: PiliPlusWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.zimingadr.piliplus.widgets
        INFOPLIST_FILE: PiliPlusWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PiliPlusWidgets/PiliPlusWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  PiliPlus:
    build:
      targets:
        PiliPlus: all
        PiliPlusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PiliPlusTests
    archive:
      config: Release
